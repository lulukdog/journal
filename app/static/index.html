<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日记">
<title>日记</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="app" hidden>
  <header id="datebar">
    <button id="prev" aria-label="前一天">‹</button>
    <div id="datelabel">—</div>
    <button id="next" aria-label="后一天">›</button>
  </header>

  <main id="stream"></main>

  <footer id="composer">
    <div class="inputrow">
      <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
      <button id="camera" title="拍一张">＋</button>
    </div>
    <div class="actionrow">
      <button id="save" class="primary">记一笔</button>
      <button id="askbtn" class="ghost">问它</button>
    </div>
  </footer>
</div>

<div id="overlay" class="overlay">
  <div class="panel" id="panel">
    <p class="loading">正在打开…</p>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<input type="file" id="file" accept="image/*" hidden>

<script src="/static/app.js"></script>
</body>
</html>
